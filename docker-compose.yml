# Nexnoon local infrastructure
# Start MongoDB: docker compose up -d
# Stop:          docker compose down
# Wipe data:     docker compose down -v

services:
  mongodb:
    image: mongo:7
    container_name: nexnoon-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexnon
    volumes:
      - nexnoon_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nexnoon_mongo_data:
    name: nexnoon_mongo_data
